# -----------------------------------------------------------------------------
# analysis.yaml - representation, fingerprint, geometry and control settings.
#
# This file drives scripts/extract_representations.py,
# scripts/run_geometry_analysis.py and scripts/make_figures.py. It must be
# compatible with the checkpoint produced by a baseline.yaml run (the model block
# below is used to rebuild the architecture when loading a checkpoint).
#
# The PRIMARY ANALYSIS metric is the Spearman Mantel correlation between
# the representation-space distance matrix and the functional-fingerprint
# distance matrix (see README "Hypothesis").
# -----------------------------------------------------------------------------

seed: 0

paths:
  data_dir: data
  checkpoint_dir: checkpoints
  results_dir: results
  figures_dir: figures

run:
  tag: baseline_v2       # corrected 3-way-split checkpoint (700 bins, no leakage)
  device: auto
  verbose: true
  synthetic: false
  synthetic_n_samples: 600
  synthetic_n_classes: 5
  synthetic_n_channels: 40

data:
  download: true
  layout: auto
  # Whole-speaker splits carved from the official training file. `dev` is used for
  # model selection; `probe` is locked and is the fingerprint/analysis split.
  dev_fraction: 0.1
  probe_fraction: 0.1
  prefer_speaker_aware: true
  split_seed: 0          # FIXED across seeds so only init/optimisation varies.
  debug: false
  max_per_class: null

# Model block: MUST match the checkpoint (used to instantiate the architecture).
# scripts/_common.load_checkpoint now refuses a mismatch instead of silently
# building a differently-sized model.
model:
  n_input: 700
  n_hidden: 256
  n_output: 20
  n_bins: 700            # 700 bins x 2 ms = 1400 ms window (matches baseline.yaml)
  bin_ms: 2.0
  tau_mem_ms: 20.0
  tau_syn_ms: 5.0
  threshold: 1.0
  reset: subtract
  readout_leak: 0.0
  surrogate_beta: 5.0
  surrogate_gamma: 0.3
  input_weight_scale: 10.0
  recurrent_weight_scale: 2.0
  recurrent_density: 1.0
  zero_self_connection: false
  signed_input_weights: true
  signed_recurrent_weights: true
  neuron_param_mode: bias
train:
  n_classes: 20

# ---------------------------------------------------------------------------
# Neuron representation (the object under study). Feature blocks:
#   intrinsic | input_conn | recurrent_in | recurrent_out | activity
#
# Weighting: "equal" (each block contributes equally) | "uniform" (each feature
# equal) | "custom" (use block_weights, e.g. {intrinsic: 0.5, input_conn: 1.0}).
#
# NOTE: "intrinsic" contains only per-neuron parameters that the architecture
# actually learns per neuron. In the default neuron_param_mode="bias" that is
# the generic *learned bias* (a learned excitability offset, NOT a biophysical
# parameter); the shared threshold/reset/base-tau constants are not emitted.
# ---------------------------------------------------------------------------
representations:
  weighting: equal           # "equal" (per-block) | "uniform" (per-feature) | "custom"
  block_weights: null        # used only when weighting: custom
  normalize_rows: false
  primary_blocks: [intrinsic, input_conn, recurrent_in, recurrent_out]
  # Tonotopic input features (channel centre of mass / spread) require a known
  # channel ordering, which is NOT established by the local docs or the SHD
  # files. Off by default and excluded from the primary representation.
  include_tonotopic_features: false
  # where the label-free activity features are measured (never the test set)
  activity_split: train

# ---------------------------------------------------------------------------
# Functional fingerprint (the independent evaluation target; USES LABELS).
# NOTE: the fingerprint is NEVER an input to the representation.
# ---------------------------------------------------------------------------
fingerprint:
  # THE one primary functional target, shared by run_geometry_analysis,
  # run_function_analysis and run_stress_test (they cannot diverge any more):
  #   PRIMARY      = tuning               -> 20-d class-conditioned firing-rate profile
  #   SECONDARY    = tuning_with_latency  -> rate + first-spike latency
  #   EXPLORATORY  = temporal             -> PSTH + temporal centre/dispersion + latency
  primary_preset: tuning
  secondary_preset: tuning_with_latency
  exploratory_preset: temporal
  # kept for the legacy single-fingerprint path; equals the primary preset
  feature_sets: [class_rate]
  standardize: column        # "column" | "none"
  normalize_rows: false
  metric: euclidean          # "euclidean" | "correlation"
  min_spikes_for_latency: 1.0
  n_psth_bins: 10            # coarse PSTH resolution (class_psth)
  # held-out split the fingerprint is measured on. 'probe' is the analysis-probe
  # split (never the official test set, and NOT the model-selection split 'dev').
  eval_split: probe

# ---------------------------------------------------------------------------
# Primary geometry/function analysis (scripts/run_function_analysis.py)
# This is the PRIMARY ANALYSIS: label-free representation vs. independent
# class-tuning fingerprint, with controls and cross-validated prediction.
# ---------------------------------------------------------------------------
function_analysis:
  # name -> feature sets (preset names or explicit lists) for each fingerprint
  presets:
    tuning: [class_rate]                                   # A. class tuning
    tuning_rate_normalized: [class_rate_norm]              # B. rate-normalized
    temporal: [class_psth, class_temporal_center, class_temporal_dispersion, class_latency]  # C. temporal
    tuning_plus_temporal: [class_rate, class_psth, class_temporal_center, class_temporal_dispersion, class_latency]
  primary_fingerprint: tuning
  rate_normalized_fingerprint: tuning_rate_normalized     # PRIMARY rate control
  secondary_fingerprints: [temporal, tuning_plus_temporal]
  n_perm: 10000             # large enough to expose (but still bounded by) the p-value floor
  bootstrap: 2000           # neuron-bootstrap CI for the primary statistic
  k_values: [3, 5, 10, 20]
  rate_matched_strata: 5    # rate-matched (stratified) control
  random_repeats: 5
  n_psth_bins: 10
  prediction:
    enabled: true
    n_splits: 5
    knn_k: 5
    alphas: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]
    random_control_seed: 12345

# ---------------------------------------------------------------------------
# Stress-test (scripts/run_stress_test.py): is the neuron-space result real or a
# trivial property of the network? Evaluates the fixed representation/control set
# for the after-learning, before-learning and rewired recurrent conditions.
# ---------------------------------------------------------------------------
stress_test:
  n_perm: 1000              # permutation count for the stress table (floor 1/(n_perm+1))
  k_values: [3, 5, 10, 20]
  # rewired recurrent-network control modes (see src/rewiring.py for what each
  # mode preserves/destroys): global = multiset only; rowwise = incoming marginals
  # preserved; columnwise = outgoing marginals preserved.
  rewired_modes: [global, rowwise, columnwise]
  include_before_learning: true
  reliability_audit: true
  prediction:
    enabled: true
    n_splits: 5
    alphas: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]

# ---------------------------------------------------------------------------
# Geometry-function analysis
# ---------------------------------------------------------------------------
geometry:
  n_perm: 1000
  k_values: [3, 5, 10, 20]
  representation_metric: euclidean
  fingerprint_metric: euclidean
  n_curve_bins: 20
  random_repeats: 5          # repeats of the random_null control

controls:
  include_before_after: true # compare untrained vs trained network

# ---------------------------------------------------------------------------
# Figures
# ---------------------------------------------------------------------------
figures:
  dpi: 200
  formats: [png, pdf]
  n_pca_components: 2

# ---------------------------------------------------------------------------
# Multi-seed robustness study (scripts/run_multiseed.py)
# ---------------------------------------------------------------------------
multiseed:
  # seeds to run the full pipeline (train -> extract -> geometry) over; seed 0
  # reuses the existing "baseline" tag, further seeds use tag "<base>_s<seed>".
  seeds: [0, 1, 2]
  train_config: configs/baseline.yaml
  analysis_config: configs/analysis.yaml
  skip_existing: true     # resume: reuse any stage whose outputs already exist
  forest_plot: true       # write a forest plot of the primary metric across seeds
