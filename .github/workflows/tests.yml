name: tests

# CPU-only, dataset-free: `V3/tests` builds tiny synthetic HDF5 files and never
# opens `data/shd_*.h5`, so no GPU and no download of the SHD dataset is needed.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install from uv.lock
        run: uv sync --locked --group dev

      - name: pytest
        run: uv run --no-sync pytest V3/tests -q
